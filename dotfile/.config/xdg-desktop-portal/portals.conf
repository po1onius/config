# xdg-desktop-portal 后端选择（niri 桌面）
#
# 放到：~/.config/xdg-desktop-portal/niri-portals.conf
#      （文件名规则是 <XDG_CURRENT_DESKTOP>-portals.conf；再放一份
#        同内容的 portals.conf 作为通用兜底）
#
# 为什么需要这个文件
# ------------------
# Guix 装的两个后端描述符都写着 UseIn=gnome：
#     ~/.guix-home/profile/share/xdg-desktop-portal/portals/gnome.portal  UseIn=gnome
#     ~/.guix-home/profile/share/xdg-desktop-portal/portals/gtk.portal    UseIn=gnome
# 而 XDG_CURRENT_DESKTOP=niri，且本机没有任何 portal 配置文件，于是 portal
# 退化成“挑第一个声称支持该接口的后端”——gnome 排在 gtk 前面（字母序）。
#
# GNOME 后端的文件选择器是委托给 Nautilus (org.gnome.Nautilus) 的，本机没装
# Nautilus，所以会话日志里反复出现：
#     Delegated FileChooser call failed: The name org.gnome.Nautilus was not
#     provided by any .service files
# 表现就是火狐（以及任何走 portal 的程序）点“打开文件”没反应。
#
# 修法
# ----
# 默认交给 GTK 后端：它自带 GTK 文件对话框，不需要 Nautilus。
# 但屏幕捕获族必须留给 GNOME 后端 —— 本机没有 xdg-desktop-portal-wlr，
# 这一族改给 gtk 会变成“没有实现”，会顺带弄坏屏幕共享。

[preferred]
default=gtk

# 屏幕捕获族：保持现状（GNOME 后端）
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.RemoteDesktop=gnome
org.freedesktop.impl.portal.InputCapture=gnome
org.freedesktop.impl.portal.Clipboard=gnome
org.freedesktop.impl.portal.GlobalShortcuts=gnome
org.freedesktop.impl.portal.Usb=gnome
org.freedesktop.impl.portal.Background=gnome
