# fuzzel —— niri 下的应用启动器
# 配色与 waybar 的「悬浮玻璃药丸」一致（强调色取自 niri focus-ring 的 #7fc8ff）
# 颜色格式：RRGGBBAA

[main]
font=LXGW WenKai Mono:size=13
dpi-aware=auto
prompt=❯ 
placeholder=输入以搜索
icons-enabled=yes
terminal=alacritty
lines=8
width=34
horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=24
layer=overlay
anchor=center
match-mode=fzf
hide-before-typing=no
exit-on-keyboard-focus-loss=yes

[colors]
background=101218bd
border=ffffff12
text=e6e9efff
input=e6e9efff
prompt=7fc8ffff
placeholder=8b93a7ff
match=7fc8ffff
selection=7fc8ff4d
selection-text=10131aff
selection-match=ffffffff
counter=8b93a7ff
message=e6e9efff

[border]
width=1
radius=14
selection-radius=9

[dmenu]
exit-immediately-if-empty=yes
